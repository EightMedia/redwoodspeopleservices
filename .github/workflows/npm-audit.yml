# Controleert de dependencies op bekende kwetsbaarheden (npm audit).
# Draait bij elke PR, bij pushes naar main en elke maandagochtend.
# Dependabot opent alleen PR's voor directe dependencies; transitieve
# kwetsbaarheden (vastgepind door een bovenliggend package) blijven anders
# stil in de Security-tab staan. Deze check maakt ze zichtbaar.
name: npm audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # maandag 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
